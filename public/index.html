<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator glasačkog listića</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7; color: #1a1a1a; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }

  header { text-align: center; padding: 24px 12px 28px; }
  header .logo {
    width: 72px; height: 72px; margin: 0 auto 14px; display: block;
    border-radius: 18px; box-shadow: 0 6px 18px rgba(31,111,235,0.25);
  }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; }
  header p { font-size: 14px; color: #666; max-width: 420px; margin: 0 auto; }

  .group-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #888; margin: 26px 4px 10px;
  }

  .card {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 1px solid #d8dade; border-radius: 14px;
    padding: 16px 16px; margin-bottom: 10px;
    text-decoration: none; color: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .card:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card .ic {
    width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .ic.gen { background: #e7f0ff; }
  .ic.mun { background: #e8fbef; }
  .ic.tool { background: #f3eaff; }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .card .tx p  { font-size: 12.5px; color: #777; }
  .card .arrow { color: #c0c4cc; font-size: 20px; flex-shrink: 0; }

  .search {
    width: 100%; font: inherit; font-size: 16px; padding: 13px 16px;
    border: 1px solid #d8dade; border-radius: 14px; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); outline: none;
  }
  .search:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31,111,235,0.15); }
  .ic.rs { background: #fdecec; }
  .ic.brc { background: #fff4e0; }
  .top-bar { display: flex; justify-content: flex-end; min-height: 26px; margin-bottom: -10px; }
  .empty { text-align: center; color: #888; font-size: 14px; padding: 28px 0; }

  footer { text-align: center; font-size: 11.5px; color: #aaa; margin-top: 32px; line-height: 1.6; }
</style>
</head>
<body>
<script src="pismo.js?v=21"></script>
<div class="wrap">
  <div class="top-bar" data-pismo-toggle></div>

  <header>
    <img src="icon.svg" class="logo" alt="">
    <h1>Simulator glasačkog listića</h1>
    <h1 class="show-unset">Симулатор гласачког листића</h1>
    <p class="hide-unset">Izaberite svoju općinu i isprobajte glasanje prije izbornog dana — pogledajte kandidate i pripremite svoj izbor.</p>
  </header>

  <div data-pismo-choose></div>
  <input type="search" id="q" class="search" placeholder="Pronađite svoju općinu…" autocomplete="off">
  <div id="list"><p class="empty">Učitavam općine…</p></div>

  <footer class="hide-unset">
    Simulator glasačkog listića<br>
    Odabiri ostaju samo na vašem uređaju.
  </footer>

</div>
<script>
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  let groups = [];

  function card(o) {
    const cls = o.entitet === "Republika Srpska" ? "rs" : o.entitet === "Brčko distrikt" ? "brc" : "gen";
    const sub = [o.kanton || o.entitet, o.trke + (o.trke === 1 ? " trka" : " trke")].filter(Boolean).join(" · ");
    return `<a class="card" href="lista.html?kod=${encodeURIComponent(o.kod)}">
      <div class="ic ${cls}">🏛️</div>
      <div class="tx"><h3>${esc(o.naziv)}</h3><p>${esc(sub)}</p></div>
      <div class="arrow">›</div></a>`;
  }

  function render() {
    // pretraga radi i na ćirilici: sve poredimo na latinici
    const q = Pismo.toLat(document.getElementById("q").value.trim()).toLocaleLowerCase("bs");
    // Bez pretrage ne prikazujemo 150+ općina — samo uputa
    if (!q) {
      document.getElementById("list").innerHTML = `<p class="empty">Upišite naziv općine, npr. „Tuzla“ ili „Banja Luka“.</p>`;
      return;
    }
    const html = groups.map(g => {
      const items = g.items.filter(o => !q || (o.naziv + " " + o.kod + " " + (o.kanton || "")).toLocaleLowerCase("bs").includes(q));
      return items.length ? `<div class="group-label">${esc(g.naslov)}</div>` + items.map(card).join("") : "";
    }).join("");
    document.getElementById("list").innerHTML = html || `<p class="empty">Nema općine za „${esc(q)}“.</p>`;
  }

  (async function () {
    try {
      const resp = await fetch("data/index.json", { cache: "no-cache" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();

      // Grad Mostar ima više šifri sa istim listićem — prikaži jednom
      const seen = new Set();
      const opcine = data.opcine.filter(o => {
        const key = o.naziv + "|" + o.kanton + "|" + o.entitet;
        if (seen.has(key)) return false;
        seen.add(key); return true;
      });

      const byGroup = new Map();
      for (const o of opcine) {
        const g = o.entitet === "Federacija BiH" ? "Federacija BiH — " + (o.kanton || "") : o.entitet || "Ostalo";
        if (!byGroup.has(g)) byGroup.set(g, []);
        byGroup.get(g).push(o);
      }
      const order = g => g.startsWith("Federacija") ? 0 : g === "Republika Srpska" ? 1 : 2;
      groups = [...byGroup.entries()]
        .map(([naslov, items]) => ({ naslov, items: items.sort((a, b) => a.naziv.localeCompare(b.naziv, "bs")) }))
        .sort((a, b) => order(a.naslov) - order(b.naslov) || a.naslov.localeCompare(b.naslov, "bs"));

      render();
    } catch (e) {
      document.getElementById("list").innerHTML = `<p class="empty">⚠️ Spisak općina nije dostupan.<br><small>${esc(e.message)}</small></p>`;
    }
  })();
  document.getElementById("q").addEventListener("input", render);
  if (!Pismo.chosen) {
    document.getElementById("q").style.display = "none";
    document.getElementById("list").style.display = "none";
  } else {
    document.getElementById("q").focus();
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
